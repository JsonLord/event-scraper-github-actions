name: Weekly Event Scraper with Autonomous Repair

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

on:
  schedule:
    # Run every Sunday at 5 PM UTC
    - cron: '0 17 * * 0'
  workflow_dispatch:
    inputs:
      urls:
        description: 'Comma-separated URLs to scrape (optional)'
        required: false
        default: 'https://rausgegangen.de/en/berlin/tipps-fuer-heute/,https://www.eventbrite.de/d/germany/berlin/events/,https://www.meetup.com/berlin/events/'

jobs:
  autonomous-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Avoid asking the hosted-runner service to acquire all matrix legs at
      # once. A small queue is more reliable during periods of runner pressure.
      max-parallel: 4
      matrix:
        include:
          # Sites with a hand-written scraper (run via autonomous_repair.py)
          # __START_DATE__/__END_DATE__ are substituted at runtime with today
          # and today+7 (see the "Resolve dynamic dates in URL" step), so
          # rausgegangen returns the coming week's events by date.
          - { name: rausgegangen_de,        url: "https://rausgegangen.de/en/berlin/eventsbydate/?geospatial_query_type=CITY&lat=52.5&lng=13.405&city=berlin&active_city_name=Berlin&start_date=__START_DATE__&end_date=__END_DATE__" }
          - { name: eventbrite_de,          url: "https://www.eventbrite.de/d/germany/berlin/events/" }
          - { name: eventbrite_com,         url: "https://www.eventbrite.com/d/germany--berlin/events/" }
          - { name: meetup_com,             url: "https://www.meetup.com/berlin/events/" }
          # userFreeform= was resolved client-side, so the US-hosted runner
          # got San Francisco results for a Berlin query. location=de--Berlin
          # with explicit coordinates is resolved server-side; the scraper
          # additionally drops any row with no independent Berlin signal.
          - { name: meetup_com_find,        url: "https://www.meetup.com/find/?location=de--Berlin&source=EVENTS&distance=tenMiles&lat=52.52&lon=13.405" }
          # Sport and networking get their own tables on the page (see
          # score_events.py's STREAMS) but nothing in the matrix carried that
          # content - measured live: yoga 12 kept, running 5, hiking 2,
          # cycling 3, founders/startup 2-3. Meetup's own keyword search is
          # the only source in the matrix that reliably has it.
          - { name: meetup_running,         url: "https://www.meetup.com/find/?location=de--Berlin&source=EVENTS&keywords=running" }
          - { name: meetup_cycling,         url: "https://www.meetup.com/find/?location=de--Berlin&source=EVENTS&keywords=cycling" }
          - { name: meetup_yoga,            url: "https://www.meetup.com/find/?location=de--Berlin&source=EVENTS&keywords=yoga" }
          - { name: meetup_hiking,          url: "https://www.meetup.com/find/?location=de--Berlin&source=EVENTS&keywords=hiking" }
          - { name: meetup_startup,         url: "https://www.meetup.com/find/?location=de--Berlin&source=EVENTS&keywords=startup" }
          - { name: meetup_founders,        url: "https://www.meetup.com/find/?location=de--Berlin&source=EVENTS&keywords=founder" }
          # Remaining sites use the generic multi-strategy scraper.
          # (duplicates from the source list - rausgegangen, staatsoper-berlin.de,
          # ritterbutzke.de - are scraped once, not once per duplicate URL)
          - { name: berlin_buehnen,         url: "https://www.berlin-buehnen.de/de/spielplan" }
          - { name: zku_berlin,             url: "https://www.zku-berlin.org/de/timeline/" }
          - { name: ufafabrik,              url: "https://ufafabrik.de/spielplan.html" }
          - { name: stadtmuseum,            url: "https://www.stadtmuseum.de/programm" }
          - { name: werk9,                  url: "https://werk9.de/" }
          # Removed - these no longer resolve or serve a listing, so they only
          # ever consumed a matrix leg and produced an empty artifact:
          #   dokk11.de                          (no DNS)
          #   schloss-und-parkglienicke.de       (no DNS)
          #   renaissancetheater.de              (parked: "jetzt kaufen!";
          #     the Berlin house is renaissance-theater.de)
          - { name: lakestudios,            url: "https://lakestudiosberlin.com/unfinished-fridays/" }
          - { name: theclubmap,             url: "https://www.theclubmap.com/berlin-techno-partys/" }
          # deutsches-theater.de is the *Munich* theatre ("Bühne der Stadt
          # München") and contributed no Berlin events; Berlin's house is
          # deutschestheater.de, whose Spielplan yields 75 listings.
          - { name: deutsches_theater,      url: "https://www.deutschestheater.de/programm/spielplan" }
          - { name: staatsoper_berlin,      url: "https://www.staatsoper-berlin.de/" }
          - { name: staatsballett_berlin,   url: "https://www.staatsballett-berlin.de/" }
          - { name: volksbuehne,            url: "https://www.volksbuehne.berlin/" }
          - { name: reinickendorf_classics, url: "https://www.reinickendorf-classics.de/januar/" }
          - { name: dice_fm_berlin,         url: "https://dice.fm/browse/berlin-5e426dbb749e68e3e923d1e4" }
          - { name: improfabrik,            url: "https://improfabrik.de/" }
          - { name: oper_in_berlin,         url: "https://www.oper-in-berlin.de/de/spielplan/" }
          - { name: venturecafe_berlin,     url: "https://venturecafe.com/berlin/" }
          # www.ritterbutzke.de is a <meta http-equiv="refresh"> redirect, which
          # a plain GET never follows - the scraper always saw the 325-byte
          # redirect stub. The real site is club.ritterbutzke.com; it renders
          # its programme client-side (0 events via plain HTTP here), so this
          # still depends on the CloakBrowser tier, same as berlin_buehnen.
          - { name: ritterbutzke,           url: "https://club.ritterbutzke.com" }
          # Was removed as "parked" under the un-hyphenated domain; the real
          # Berlin house is at the hyphenated one. Also JS-rendered - 0 via
          # plain HTTP here, CloakBrowser-dependent.
          - { name: renaissance_theater,    url: "https://renaissance-theater.de/spielplan/" }
          # New, verified live: 8 raw -> 3 kept via plain HTTP (environmental
          # education workshops, e.g. "Kräutertraditionen").
          - { name: freilandlabor_britz,    url: "https://www.freilandlabor-britz.de/" }
          # New, verified live: 32 raw -> 2 kept via plain HTTP. Tempelhofer
          # Feld's own events page - outdoor programming.
          - { name: thf_berlin,             url: "https://www.thf-berlin.de/aktuelles/veranstaltungen" }
          # orangerie-nk.de/events is a private-venue-booking page ("book your
          # wedding here"), not a calendar - the real programme sits on the
          # homepage itself. Verified live: extracts a real dated event
          # ("Von Nord nach Süd", 27 Sep) correctly; it just fell outside the
          # 7-day window this was tested against, which is expected, not a bug.
          - { name: orangerie_neukoelln,    url: "https://www.orangerie-nk.de/" }
      fail-fast: false
    env:
      TARGET_URL: ${{ matrix.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cloakbrowser python-dotenv pyyaml requests beautifulsoup4 lxml

      - name: Install CloakBrowser Binary
        # This step intermittently segfaults on the GitHub runner (exit 139).
        # It's non-fatal: the generic scraper works without CloakBrowser
        # (it's only the 3rd-tier fallback) and CloakBrowser re-downloads the
        # binary on first launch() anyway, so a failed pre-install must not
        # take down the whole matrix leg.
        continue-on-error: true
        run: python -m cloakbrowser install

      - name: Configure environment
        run: |
          echo "JULES_API_KEY=${{ secrets.JULES_API_KEY }}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      # Substitute date placeholders in the target URL so date-parameterised
      # sources (e.g. rausgegangen's "by date" view) fetch the coming 7 days.
      # Sites without placeholders are unaffected.
      - name: Resolve dynamic dates in URL
        run: |
          START_DATE="$(date -u +%Y-%m-%d)"
          END_DATE="$(date -u -d '+7 days' +%Y-%m-%d)"
          RESOLVED="${TARGET_URL}"
          RESOLVED="${RESOLVED//__START_DATE__/${START_DATE}}"
          RESOLVED="${RESOLVED//__END_DATE__/${END_DATE}}"
          echo "TARGET_URL=${RESOLVED}" >> "$GITHUB_ENV"
          echo "Scrape URL: ${RESOLVED}"

      - name: Extract site info
        id: site-info
        run: |
          URL="${TARGET_URL}"
          SITE_NAME="${{ matrix.name }}"
          echo "site_name=$SITE_NAME" >> $GITHUB_OUTPUT

          # Sites with a hand-written scraper get the autonomous repair loop
          # (retries + Jules-driven fixes); everything else uses the shared
          # generic scraper directly (repairing a script shared by 20+ sites
          # based on one site's failure would corrupt it for the rest).
          # rausgegangen's date view is server-rendered with clean event-detail
          # slugs, which the generic scraper handles well (cleaner than the old
          # Jina-markdown scraper), so it routes to the generic path.
          if [[ "$URL" == *"eventbrite"* ]]; then
            echo "script=scripts/eventbrite_scraper.py" >> $GITHUB_OUTPUT
            echo "use_repair_loop=true" >> $GITHUB_OUTPUT
          elif [[ "$URL" == *"meetup"* ]]; then
            echo "script=scripts/meetup_scraper.py" >> $GITHUB_OUTPUT
            echo "use_repair_loop=true" >> $GITHUB_OUTPUT
          else
            echo "script=scripts/generic_event_scraper.py" >> $GITHUB_OUTPUT
            echo "use_repair_loop=false" >> $GITHUB_OUTPUT
          fi

      - name: Run scraper
        run: |
          if [ "${{ steps.site-info.outputs.use_repair_loop }}" = "true" ]; then
            python scripts/autonomous_repair.py \
              --script "${{ steps.site-info.outputs.script }}" \
              --url "${TARGET_URL}" \
              --site-name "${{ steps.site-info.outputs.site_name }}" \
              --retries 3
          else
            mkdir -p data/html
            python "${{ steps.site-info.outputs.script }}" \
              --url "${TARGET_URL}" \
              --output "data/raw_${{ steps.site-info.outputs.site_name }}.json" \
              --price-max 20 \
              --date-days 7 \
              --save-html \
              --html-output "data/html/${{ steps.site-info.outputs.site_name }}.html"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ steps.site-info.outputs.site_name }}
          path: |
            data/raw_${{ steps.site-info.outputs.site_name }}.json
            data/html/${{ steps.site-info.outputs.site_name }}.html
          retention-days: 7
          if-no-files-found: warn

  aggregate-and-deploy:
    needs: autonomous-scrape
    # Run even if some scrape legs failed (fail-fast is off) so the pipeline
    # still aggregates, scores and deploys whatever events were collected.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-*
          path: data/
          merge-multiple: true

      - name: Aggregate events
        run: |
          python - <<'PY'
          import glob, json, os

          all_events, per_source = [], {}
          for path in sorted(glob.glob('data/raw_*.json')):
              try:
                  with open(path, encoding='utf-8') as handle:
                      events = json.load(handle).get('events', [])
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"  !! {path}: unreadable ({exc})")
                  continue
              per_source[os.path.basename(path)] = len(events)
              all_events.extend(events)

          # Print the per-source yield so a source that has silently started
          # returning nothing is visible in the run log rather than only as a
          # smaller total.
          for name, count in sorted(per_source.items(), key=lambda kv: -kv[1]):
              print(f"  {count:4d}  {name}")
          print(f"TOTAL {len(all_events)} events from {len(per_source)} sources")

          os.makedirs('docs', exist_ok=True)
          with open('docs/events.json', 'w', encoding='utf-8') as out:
              json.dump({'events': all_events, 'count': len(all_events)}, out,
                        indent=2, ensure_ascii=False)
          PY

      - name: Configure environment
        run: |
          echo "JULES_API_KEY=${{ secrets.JULES_API_KEY }}" >> $GITHUB_ENV
          echo "JULES_SOURCE_ID=${{ secrets.JULES_SOURCE_ID }}" >> $GITHUB_ENV

      # Resolve the Jules source id for this repo at runtime so it doesn't have
      # to be maintained as a separate secret. Only runs if a JULES_SOURCE_ID
      # secret wasn't already provided (that takes precedence). Needs the
      # JULES_API_KEY set above; non-fatal if it can't resolve.
      - name: Resolve Jules source ID
        run: |
          if [ -z "$JULES_SOURCE_ID" ] && [ -n "$JULES_API_KEY" ]; then
            SOURCE_ID="$(python scripts/jules_client.py find-source "$GITHUB_REPOSITORY" 2>/dev/null || true)"
            if [ -n "$SOURCE_ID" ]; then
              echo "JULES_SOURCE_ID=$SOURCE_ID" >> $GITHUB_ENV
              echo "Resolved Jules source: $SOURCE_ID"
            else
              echo "Could not resolve a Jules source for $GITHUB_REPOSITORY; recovery runs without repo context"
            fi
          fi

      # The one Jules session in the chain: recover events from sites whose
      # scrape returned nothing (the hard Cloudflare/JS-heavy pages), using
      # the saved HTML snapshots. Best-effort - merges whatever it recovers
      # back into docs/events.json, or leaves it unchanged if Jules is
      # unavailable.
      - name: Recover failed scrapes via Jules
        run: |
          python scripts/jules_recover_failed.py \
            --aggregated docs/events.json \
            --raw-dir data \
            --html-dir data/html \
            --output docs/events.json

      # Keep the aggregated, recovered source data in Git as well as in the
      # short-lived Pages artifact. This makes the events shown by the site
      # inspectable from the repository after the workflow runner is removed.
      - name: Persist aggregated events in repository
        run: |
          python - <<'PY'
          import json, sys

          def count(path):
              try:
                  with open(path, encoding='utf-8') as handle:
                      return len(json.load(handle).get('events', []))
              except (OSError, json.JSONDecodeError):
                  return 0

          fresh, existing = count('docs/events.json'), count('data/events.json')

          # A run that collapses to a fraction of the last good aggregate has
          # almost certainly been blocked or broken rather than finding that
          # Berlin genuinely has no events. Publishing it anyway is how a
          # 221-event dataset became an empty file. Keep the previous data and
          # fail loudly instead.
          if existing and fresh < max(1, existing // 4):
              print(f"::error::Aggregate collapsed: {fresh} events vs {existing} previously. "
                    "Keeping the existing data/events.json.")
              sys.exit(1)

          with open('docs/events.json', encoding='utf-8') as src:
              payload = src.read()
          with open('data/events.json', 'w', encoding='utf-8') as dst:
              dst.write(payload)
          print(f"Persisted {fresh} events (previously {existing}).")
          PY

      # Deterministic scoring/categorization/filtering against the preference
      # profile (max 20 EUR, free preferred, category + Charlottenburg
      # proximity weighting), then ordered by day and, within each day,
      # from free to dearest.
      - name: Score and categorize events
        run: |
          python scripts/score_events.py \
            --input docs/events.json \
            --output docs/events_scored.json \
            --max-price 20

      # docs/events_scored.json only lived in the Pages deployment artifact,
      # which GitHub reclaims after its retention window - the ranked,
      # streamed and filtered output actually shown on the page (unlike raw
      # data/events.json, committed above) had no durable copy at all. Commit
      # it alongside the raw aggregate so both the input and the output of
      # scoring are inspectable from the repo after the run is gone.
      - name: Persist scored events in repository
        run: cp docs/events_scored.json data/events_scored.json

      - name: Publish frontend
        run: |
          cp web/index.html docs/index.html
          touch docs/.nojekyll

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload synthesised event findings
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Commit events and improvements (if any)
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/events.json data/events_scored.json scripts/*.py
          if git diff --staged --quiet; then
            echo "No event or scraper changes to commit"
          else
            git commit -m "Update weekly aggregated events"
            git pull --rebase
            git push
          fi

  publish-pages:
    name: Publish weekly event table
    needs: aggregate-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy synthesised event findings to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
