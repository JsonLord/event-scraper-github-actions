name: R1.2 read-only staging qualification

# Registered manual workflow reused on the PR branch: no default-branch merge
# or downstream workflow dispatch is needed to execute qualification.
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        description: 'Full qualification, or bounded Rausgegangen completion using remaining R1.2 allowance'
        options: [full, raus-completion, raus-search]
        default: full
permissions:
  contents: read
concurrency:
  group: r12-staging-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated staging tools
        run: |
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
          export PIP_CACHE_DIR="$RUNNER_TEMP/pip-cache"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright"
          python -m venv "$RUNNER_TEMP/r12-venv"
          "$RUNNER_TEMP/r12-venv/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/r12-venv/bin/python" -m playwright install --with-deps chromium
      - name: Run production pipeline in temporary staging storage
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          QUALIFICATION_PHASE: ${{ inputs.phase }}
        run: |
          "$RUNNER_TEMP/r12-venv/bin/python" scripts/qualify_r12.py --output "$RUNNER_TEMP/r12-output" --phase "$QUALIFICATION_PHASE"
      - name: Confirm checkout has no generated or modified files
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-sanitized-staging-diagnostics
          path: ${{ runner.temp }}/r12-output
          retention-days: 7
