name: Restored branch read-only website qualification
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly deploy this restored branch review build to live Pages'
        type: boolean
        default: false
      raus_tinyfish:
        description: 'Allow only Rausgegangen discovery: maximum two Search calls and three permitted Fetch URLs'
        type: boolean
        default: false
      raus_browser:
        description: 'Optional Raus listing browser; robots policy is checked before launch'
        type: choice
        options: [none, camoufox]
        default: none
      window_start:
        description: 'Optional first date YYYY-MM-DD; provide both dates, otherwise today through today+7'
        type: string
        default: ''
      window_end:
        description: 'Optional inclusive final date YYYY-MM-DD, at most eight dates in the window'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: restored-branch-read-only-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: Europe/Berlin
      XDG_CACHE_HOME: ${{ runner.temp }}/browser-cache
      XDG_CONFIG_HOME: ${{ runner.temp }}/browser-config
      PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated direct-HTTP qualification dependencies
        env:
          RAUS_BROWSER: ${{ inputs.raus_browser }}
        run: |
          python -m venv "$RUNNER_TEMP/qualification-venv"
          "$RUNNER_TEMP/qualification-venv/bin/pip" install requests beautifulsoup4 lxml PyYAML pytest python-dotenv
          if [ "$RAUS_BROWSER" = "camoufox" ]; then "$RUNNER_TEMP/qualification-venv/bin/pip" install camoufox==0.5.8; fi
      - name: Preserve scoring, frontend and shared model; test selective adapters
        run: |
          git diff --exit-code 70787edd3d4b99124e38a179b7737f27c60ba229 -- scripts/event_utils.py scripts/ticket_evidence.py scripts/score_events.py web/index.html
          "$RUNNER_TEMP/qualification-venv/bin/python" -m pytest -q
      - name: Scrape and measure each configured website
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          QUALIFY_RAUS_TINYFISH: ${{ inputs.raus_tinyfish }}
          QUALIFY_RAUS_BROWSER: ${{ inputs.raus_browser }}
          QUALIFY_WINDOW_START: ${{ inputs.window_start }}
          QUALIFY_WINDOW_END: ${{ inputs.window_end }}
        run: |
          EXTRA=()
          if [ "$QUALIFY_RAUS_TINYFISH" = "true" ]; then EXTRA+=(--raus-tinyfish); fi
          if [ -n "$QUALIFY_RAUS_BROWSER" ]; then EXTRA+=(--raus-browser "$QUALIFY_RAUS_BROWSER"); fi
          if [ -n "$QUALIFY_WINDOW_START" ]; then EXTRA+=(--window-start "$QUALIFY_WINDOW_START"); fi
          if [ -n "$QUALIFY_WINDOW_END" ]; then EXTRA+=(--window-end "$QUALIFY_WINDOW_END"); fi
          "$RUNNER_TEMP/qualification-venv/bin/python" scripts/qualify_restored_branch.py --output "$RUNNER_TEMP/restored-qualification" "${EXTRA[@]}"
          cat "$RUNNER_TEMP/restored-qualification/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-branch-website-qualification
          path: ${{ runner.temp }}/restored-qualification
          retention-days: 14
          include-hidden-files: true
  deploy:
    needs: qualify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/restore-before-tinyfish-search' && inputs.publish == true }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: runner branch
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: restored-branch-website-qualification
          path: ${{ runner.temp }}/restored-qualification
      - name: Validate exact review build and freshness
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/restored-qualification
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          root=Path(os.environ['ARTIFACT_ROOT'])
          manifest=json.loads((root/'site-manifest.json').read_text())
          assert manifest['commit']==os.environ['EXPECTED_SHA']
          age=datetime.now(timezone.utc)-datetime.fromisoformat(manifest['generated_at'])
          assert timedelta(0)<=age<timedelta(hours=2)
          assert manifest['count']>0
          for name, checksum in manifest['files'].items():
              path=(root/'site'/name).resolve()
              assert path.is_relative_to((root/'site').resolve())
              assert hashlib.sha256(path.read_bytes()).hexdigest()==checksum
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/restored-qualification/site
      - uses: actions/deploy-pages@v4
        id: deployment
