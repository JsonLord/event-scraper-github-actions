name: Fetch Strategy Probe

# Manual only. This is a measurement tool, not part of the weekly pipeline:
# it answers "which way of fetching this site actually yields events" for the
# sources an ordinary GET cannot reach.
#
# It has to run here rather than on a developer machine, because the answer is
# IP-dependent - a hosted runner and a home connection get different responses
# from exactly these sites (Eventbrite answers this runner with HTTP 405 and a
# residential IP with a parseable 200).
#
# Read the table it prints, then wire the winner into generic_event_scraper.py
# and stop paying for the rest.

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites to probe: inline JSON {"name":"url"}, or blank for config/probe_sites.json'
        required: false
        default: ''
      strategies:
        description: 'Comma-separated subset (direct, cloakbrowser, jina_markdown, jina_html, jina_html_nocache, jina_html_browser, jina_html_proxy)'
        required: false
        default: 'direct,cloakbrowser,jina_markdown,jina_html,jina_html_nocache,jina_html_browser,jina_html_proxy'
      date_days:
        description: 'Date window in days'
        required: false
        default: '7'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml
          pip install cloakbrowser

      - name: Install CloakBrowser binary
        # Non-fatal: the probe reports a failing strategy as a result rather
        # than crashing, and that is itself worth measuring.
        continue-on-error: true
        run: python -m cloakbrowser install

      - name: Probe
        env:
          # Add this under Settings -> Secrets and variables -> Actions.
          # Without it every jina_* strategy reports "JINA_API_KEY not set",
          # which the probe prints as a result rather than failing the run.
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          mkdir -p probe
          SITES='${{ github.event.inputs.sites }}'
          if [ -z "$SITES" ]; then SITES=config/probe_sites.json; fi

          python scripts/fetch_strategy_probe.py \
            --sites "$SITES" \
            --strategies "${{ github.event.inputs.strategies }}" \
            --date-days "${{ github.event.inputs.date_days }}" \
            --output probe/results.json \
            | tee probe/console.txt || true

      - name: Publish the table to the run summary
        if: always()
        run: |
          {
            echo '## Fetch strategy probe'
            echo
            echo 'Events kept per site per strategy, measured on this runner.'
            echo
            echo '```'
            sed -n '/^site /,$p' probe/console.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-strategy-probe
          path: probe/
          retention-days: 30
          if-no-files-found: warn
