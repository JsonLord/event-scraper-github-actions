name: Publish synthesised event findings

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/**"
      - "config/verification_policy.json"
      - "web/index.html"
      - ".github/workflows/jekyll-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install requests beautifulsoup4 lxml python-dotenv

      - name: Build and validate shared dataset
        run: |
          python scripts/build_page_dataset.py --output-dir _site
          python scripts/audit_events.py --input _site/events_scored.json --gate --output /tmp/quality.json

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload event table
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOYMENT_ENABLED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
