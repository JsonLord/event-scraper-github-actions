name: Publish synthesised event findings

on:
  push:
    branches: ["main"]
    paths:
      - "data/events.json"
      - "scripts/score_events.py"
      - "web/index.html"
      - ".github/workflows/jekyll-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synthesise event findings
        run: |
          mkdir -p _site
          python scripts/score_events.py \
            --input data/events.json \
            --output _site/events_scored.json \
            --max-price 20

      - name: Build event table
        run: |
          cp web/index.html _site/index.html
          touch _site/.nojekyll

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload event table
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
