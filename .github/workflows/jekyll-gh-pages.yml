name: Publish reviewed two-source pilot
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful R1.4 candidate run built from this exact deployment commit'
        required: true
        type: string
      manifest_sha256:
        description: 'SHA-256 of the reviewed release-manifest.json'
        required: true
        type: string
      branch_release:
        description: 'Explicitly publish the reviewed PR-33 branch candidate to live Pages'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && ((github.ref == 'refs/heads/main' && vars.PAGES_DEPLOYMENT_ENABLED == 'true' && vars.RELEASE_PROFILE == 'berlin-ufa-pilot-v1') || (github.ref == 'refs/heads/codex/berlin-events-r1-quality' && inputs.branch_release == true)) }}
    permissions:
      contents: read
      actions: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate candidate workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          run=os.environ['CANDIDATE_RUN']
          assert re.fullmatch(r'[0-9]+',run), 'Invalid run ID'
          record=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}']))
          assert record['conclusion']=='success' and record['event']=='workflow_dispatch'
          assert record['head_branch']==os.environ['EXPECTED_BRANCH'] and record['head_sha']==os.environ['EXPECTED_SHA']
          assert record['path']=='.github/workflows/fetch-strategy-probe.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: r14-pilot-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pilot
      - name: Validate reviewed manifest and exact publication coverage
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python scripts/pilot_release.py --artifact "$RUNNER_TEMP/pilot" --manifest-sha256 "$MANIFEST_SHA256" --commit "$EXPECTED_SHA" --run-id "$CANDIDATE_RUN"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pilot/site
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && ((github.ref == 'refs/heads/main' && vars.PAGES_DEPLOYMENT_ENABLED == 'true' && vars.RELEASE_PROFILE == 'berlin-ufa-pilot-v1') || (github.ref == 'refs/heads/codex/berlin-events-r1-quality' && inputs.branch_release == true)) }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: r14-pilot-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pilot-final
      - name: Revalidate freshness after environment approval
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python scripts/pilot_release.py --artifact "$RUNNER_TEMP/pilot-final" --manifest-sha256 "$MANIFEST_SHA256" --commit "$EXPECTED_SHA" --run-id "$CANDIDATE_RUN"
      - uses: actions/deploy-pages@v4
        id: deployment
